workflows:
  android-workflow:
    name: Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Build Android AAB
        script: |
          cd dum
          chmod +x app/gradlew || chmod +x gradlew || true
          ./gradlew bundleRelease || ./app/gradlew bundleRelease || cd app && ./gradlew bundleRelease
    artifacts:
      - "**/build/outputs/bundle/release/*.aab"
