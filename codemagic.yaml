workflows:
  android-workflow:
    name: Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Setup Gradle and Build AAB
        script: |
          cd dum
          # Doğrudan sistemin kendi gradle motorunu kullanarak derlemeyi tetikliyoruz
          gradle bundleRelease
    artifacts:
      - dum/app/build/outputs/bundle/release/*.aab
