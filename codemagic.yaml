workflows:
  android-workflow:
    name: Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Setup Gradle Wrapper and Build AAB
        script: |
          # Önce projenin en dışındayken gradle motorunu kuruyoruz
          gradle wrapper --gradle-version 8.2
          
          # Şimdi dum klasörünün içine girip oradaki gradle yapılandırmasını tetikliyoruz
          cd dum
          chmod +x ../gradlew
          ../gradlew bundleRelease
    artifacts:
      - dum/app/build/outputs/bundle/release/*.aab
