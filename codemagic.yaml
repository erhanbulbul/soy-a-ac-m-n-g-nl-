workflows:
  android-workflow:
    name: Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Build Android AAB
        script: |
          cd yoruldum
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # İmza doğrulamasını atlayarak doğrudan AAB çıktısı alma komutu
          ./gradlew bundleRelease -x validateSigningRelease
    artifacts:
      - yoruldum/app/build/outputs/bundle/release/*.aab
