workflows:
  android-workflow:
    name: Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Setup Gradle Wrapper and Build AAB
        script: |
          cd dum
          # Eksik olan gradle motorunu sıfırdan bulutta kuruyoruz
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - dum/app/build/outputs/bundle/release/*.aab
