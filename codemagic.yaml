workflows:
  android-workflow:
    name: Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Build Android AAB
        script: |
          cd yoruldum
          # Projenin çalışabilmesi için şart koşulan 9.3.1 motorunu kuruyoruz
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - yoruldum/app/build/outputs/bundle/release/*.aab
