workflows:
  android-workflow:
    name: Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Setup Gradle and Build AAB
        script: |
          # Doğrudan yoruldum klasörünün içine giriyoruz
          cd yoruldum
          
          # Gradle motorunu direkt bu klasörün içinde oluşturuyoruz
          gradle wrapper --gradle-version 8.9.1
          
          # Oluşan motoru çalıştırılabilir yapıyoruz
          chmod +x gradlew
          
          # Derlemeyi başlatıyoruz
          ./gradlew bundleRelease
    artifacts:
      - yoruldum/app/build/outputs/bundle/release/*.aab
